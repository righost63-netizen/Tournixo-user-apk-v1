<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tournaments - Tournixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/components/bottom-nav.css">
    <link rel="stylesheet" href="../styles/components/main-header.css">
    <link rel="stylesheet" href="../styles/components/skeleton-loader.css">
    <link rel="stylesheet" href="../styles/pages/tournaments.css">
    <!-- SLOT GRID (2026-11-13): Join modal এই list থেকেও খোলে, তাই picker CSS এখানেও লাগবে। -->
    <link rel="stylesheet" href="../styles/components/slot-picker.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="theme-color" content="#080808">
<!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">

</head>

<body data-page="tournaments">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- TOURNAMENTS TAB -->
            <div id="tab-tournaments" class="tab-panel active-tab" style="flex:1;flex-direction:column;overflow:hidden;">
                <div class="home-header">
                    <div>
                        <div class="home-avatar" id="home-avatar"></div>
                        <div>
                            <div class="greeting-text">Tournixo</div>
                            <div class="greeting-sub">Free Fire</div>
                        </div>
                    </div>
                    <div class="home-header-actions">
                        <div class="wallet-preview">
                            <!-- UNSLOP: font-weight:800 removed from the ₹ mark; weight now comes from CSS. -->
                            <span style="color:#C7FF3E;">₹</span>
                            <span id="home-balance">0</span>
                        </div>
                        <button class="icon-btn" onclick="openPage('notifications')" aria-label="Notifications">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="tab-badge" id="notif-badge" style="display:none;"></span>
                        </button>
                    </div>
                </div>

                <!-- FIX (2026-11-19): search bar removed — Tournaments page
                     is browse-only now (filter tabs + mode chips). -->
                <!-- Filters -->
                <div class="filter-tabs" style="overflow-x: auto; scrollbar-width: none;">
                    <button class="filter-tab" onclick="setTournFilter('all',this)">All</button>
                    <button class="filter-tab active" onclick="setTournFilter('upcoming',this)">Upcoming</button>
                    <button class="filter-tab" onclick="setTournFilter('ongoing',this)">Ongoing</button>
                    <button class="filter-tab" onclick="setTournFilter('completed',this)">Completed</button>
                    <!-- FIX (2026-11-19): Cancelled tab removed — cancelled
                         tournaments stay visible under All. -->
                </div>
                <div class="scroll-area" id="tournaments-list"></div>
            </div>


        </div>
    </div>

    <script type="module" src="../scripts/tournaments.js"></script>
</body>

</html>
