<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Tournixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/login.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="login">
    <div id="app">

        <!-- ═══════════════════════════════════════════════════════════
             LOGIN SCREEN — redesign (2026-11-20)
             Mockup: Tournixo___Splash___Sign_in.html — logo tile +
             "Welcome back", surface fields, lime focus, solid-lime
             primary button, trust footer. Look only: every id,
             onclick and class scripts/auth-ui.js uses is kept.
        ═══════════════════════════════════════════════════════════ -->
        <div id="screen-login" class="screen active">
            <div class="auth-scroll">
                <div class="auth-inner">

                    <!-- Logo tile (NEW logo SVG from the user's mockup) -->
                    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
                        <defs>
                            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcff6e"/><stop offset="1" stop-color="#b4f01f"/></linearGradient>
                            <symbol id="logo" viewBox="0 0 96 96">
                                <rect width="96" height="96" rx="24" fill="url(#g)"/>
                                <path d="M24 24h48v14a24 24 0 0 1-17 23v9h10a4 4 0 0 1 0 8H31a4 4 0 0 1 0-8h10v-9A24 24 0 0 1 24 38z" fill="#0a0f00"/>
                                <path d="M24 30H16a2 2 0 0 0-2 2v4a12 12 0 0 0 10 11.8M72 30h8a2 2 0 0 1 2 2v4a12 12 0 0 1-10 11.8" fill="none" stroke="#0a0f00" stroke-width="5" stroke-linecap="round" opacity=".0"/>
                                <path d="M36 31h24v6a12 12 0 0 1-24 0z" fill="url(#g)"/>
                            </symbol>
                        </defs>
                    </svg>
                    <div class="auth-brand">
                        <svg class="logo" viewBox="0 0 96 96" role="img" aria-label="Tournixo logo"><use href="#logo"/></svg>
                        <div class="auth-wordmark">Tournixo</div>
                        <small class="auth-tagline">Free Fire tournaments</small>
                    </div>

                    <!-- Sign-in form -->
                    <h1>Welcome back</h1>
                    <p class="sub">Sign in to your account to continue.</p>

                    <label class="auth-label" for="login-email">Email</label>
                    <div class="field">
                        <input id="login-email" type="email" placeholder="you@email.com" autocomplete="email" inputmode="email">
                    </div>

                    <label class="auth-label" for="login-pass">Password</label>
                    <div class="field">
                        <input id="login-pass" type="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right:52px">
                        <!-- Eye icon is drawn by togglePass() in
                             utils/dom-helpers.js as an inline SVG (eye / eye-off). -->
                        <button type="button" class="input-toggle" aria-label="Show or hide password" onclick="togglePass('login-pass',this)"></button>
                    </div>

                    <div class="auth-err" id="login-error" role="alert"></div>

                    <div class="auth-links">
                        <button type="button" class="link-btn" id="resend-verify-btn" onclick="resendVerification()">Resend verification</button>
                        <button type="button" class="link-btn" onclick="showForgotPass()">Forgot password?</button>
                    </div>

                    <button class="btn btn-primary btn-block" id="login-btn" onclick="doLogin()">
                        <span>Sign in</span>
                    </button>

                    <div class="auth-divider"><span>New to Tournixo?</span></div>

                    <button class="btn btn-secondary btn-block" onclick="window.navTo('register')">Create account</button>

                    <!-- Trust footer: lime line icons, no emoji -->
                    <div class="auth-trust">
                        <span class="trust-item"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Secure wallet</span>
                        <span class="trust-item"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/></svg>Daily tournaments</span>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script type="module" src="../scripts/navigation.js"></script>
<script type="module" src="../scripts/auth-ui.js"></script>
</body>

</html>
