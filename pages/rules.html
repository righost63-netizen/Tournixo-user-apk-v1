<!DOCTYPE html>

<body data-page="rules">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- Tournament Rules — premium full page (mirrors terms.html) -->
            <div class="page terms-page" id="page-rules">

                <header class="terms-hero">

                    <p class="terms-hero-sub">The tournament rules of Tournixo</p>
                    <div id="rules-updated-chip" class="terms-updated-chip" style="display:none;"></div>
                </header>

                <!-- Content -->
                <main class="terms-content-area">
                    <article id="rules-content" class="terms-content">
                        <div class="terms-empty-state">

                        </div>
                    </article>
                    <footer class="terms-footer">

                        <div class="terms-footer-note">Play fair · Win real</div>

            </div>

        </div>
