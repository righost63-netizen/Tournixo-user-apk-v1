<!-- FORGOT PASSWORD MODAL -->
<div id="modal-forgot-pass" class="full-modal">
    <div class="modal-header">
        <button class="back-btn" onclick="closeModal('modal-forgot-pass')">‹ Back</button>
        <h2>Reset Password</h2>
    </div>
    <div class="scroll-area" style="padding:20px;">
        <p style="font-size:14px;color:var(--text2);margin-bottom:20px;">Enter your account email and we'll send you a link to reset your password.</p>
        <label class="auth-label">Email</label>
        <div class="input-group">
            <!-- UNSLOP Group 4 (pass 3): mail emoji → line icon. -->
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input id="forgot-email" type="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="forgot-send-btn" style="margin-top:20px;" onclick="sendPasswordReset()">
            <span>Send Reset Link</span>
        </button>
    </div>
</div>
