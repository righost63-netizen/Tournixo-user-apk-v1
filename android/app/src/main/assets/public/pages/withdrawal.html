<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Withdraw - Tournixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/payment.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="withdrawal">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- WITHDRAW BOTTOM SHEET — Premium iOS Style -->
            <div id="overlay-withdraw" class="overlay active" onclick="if(event.target.id==='overlay-withdraw') closeWithdrawSheet()">
                <div class="bottom-sheet">
                    <div class="sheet-handle"></div>
                    <div class="sheet-content">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
                            <h3 class="sheet-title" style="margin:0;">Withdraw Funds</h3>
                            <button onclick="closeWithdrawSheet()" aria-label="Close" style="background:none;border:none;color:var(--text2);cursor:pointer;display:inline-flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                        </div>
                        <p class="sheet-subtitle" id="wd-min-text">Minimum withdrawal: ₹100 · Maximum: your Winning Balance</p>

                        <!-- v8.8 (item 6): settings/deposit না থাকলে
                             persistent block message — submit disable হয়,
                             permission-denied toast দেখানো হয় না। -->
                        <div id="wd-settings-error" role="alert" style="display:none; background:var(--bg3); border:1px solid var(--error); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--text); line-height:1.6; margin-bottom:12px;"></div>

                        <div class="card-inset">

                            <div class="card-inset">
                                <div class="row">
                                    <span class="text-sm">Available Balance</span>
                                    <span id="withdraw-available" class="withdraw-available">₹0</span>
                                </div>
                            </div>

                            <label class="auth-label">Amount (₹)</label>
                            <div class="input-group">
                                <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span>
                                <input id="wd-amount" type="number" placeholder="Min ₹100" inputmode="decimal">
                            </div>

                            <label class="auth-label">UPI ID</label>
                            <div class="input-group">
                                <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg></span>
                                <input id="wd-phone" type="text" placeholder="yourname@upi">
                            </div>

                            <button class="btn btn-primary" onclick="submitWithdraw()">Request Withdrawal</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="../scripts/withdrawal.js"></script>
</body>

</html>
